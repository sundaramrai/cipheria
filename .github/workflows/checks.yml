name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cipheria_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: cipheria_import_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipheria_test -d cipheria_import_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cipheria_test:local-test-only@127.0.0.1:5432/cipheria_import_test
      TEST_DATABASE_URL: postgresql+psycopg://cipheria_test:local-test-only@127.0.0.1:5432/cipheria_import_test
      E2E_DATABASE_URL: postgresql+psycopg://cipheria_test:local-test-only@127.0.0.1:5432/cipheria_import_test
      JWT_SECRET: isolated-ci-tests-only-not-production-01234567890123456789
      ENVIRONMENT: development
      REDIS_ENABLED: 'false'
      SMTP_HOST: ''
      INTERNAL_API_ORIGIN: http://127.0.0.1:8018
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.5'
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory api --frozen --group dev
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: uv run ruff check .
        working-directory: api
      - run: uv run python -W ignore::DeprecationWarning -m unittest discover -s tests
        working-directory: api
      - run: uv run alembic -c ../alembic.ini upgrade head
        working-directory: api
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
