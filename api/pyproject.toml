[project]
name = "cipheria-api"
version = "0.1.0"
description = "Cipheria FastAPI backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt==5.0.0",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.143.3",
    "limits==5.8.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "PyJWT==2.15.1",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "slowapi==0.1.10",
    "sqlalchemy==2.1.5",
]

[dependency-groups]
dev = [
    "alembic==1.20.0",
    "mako==1.4.3",
    "ruff==0.17.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
